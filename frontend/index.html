<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2545">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PaperFolio">
  <title>PaperFolio</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="back" id="back" hidden aria-label="Indietro">&#8249;</button>
    <h1 id="title">PaperFolio</h1>
    <button class="badge-sim" id="account" aria-label="Cambia portafoglio">Simulazione</button>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar">
    <a href="#/" data-tab="portfolio"><span class="ico">&#9673;</span>Portafoglio</a>
    <a href="#/cerca" data-tab="search"><span class="ico">&#9906;</span>Cerca</a>
    <a href="#/ordini" data-tab="orders"><span class="ico">&#8645;</span>Ordini</a>
    <a href="#/fiscale" data-tab="fiscal"><span class="ico">&#167;</span>Fiscale</a>
    <a href="#/impostazioni" data-tab="settings"><span class="ico">&#9881;</span>Impostazioni</a>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
